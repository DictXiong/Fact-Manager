<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>事实管理 · Fact Manager</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <section id="login" class="login-shell">
      <div class="login-card">
        <div class="brand-icon">F</div>
        <p class="eyebrow">FACT MANAGER</p>
        <h1>事实管理</h1>
        <p class="muted">管理来源、核对证据，发布经过确认的事实。</p>
        <form id="login-form">
          <label
            >管理员 Token<input
              id="login-token"
              type="password"
              autocomplete="current-password"
              required
              placeholder="输入管理员 Token" /></label
          ><button type="submit" class="primary full">登录管理台</button>
          <p id="login-error" class="error" role="alert"></p>
        </form>
        <p class="fine">
          MCP Token 由各事实库单独生成，用于智能体的读取或检查访问。
        </p>
      </div>
    </section>
    <div id="workspace" class="workspace" hidden>
      <aside class="sidebar" aria-label="事实库导航">
        <div class="sidebar-brand-row">
          <a href="/" class="brand" aria-label="事实管理首页"
            ><span class="brand-icon small">F</span
            ><span class="brand-label"
              >事实管理<small>FACT MANAGER</small></span
            ></a
          >
          <button
            id="sidebar-toggle"
            class="sidebar-toggle"
            type="button"
            aria-controls="sidebar-content"
            aria-expanded="true"
            aria-label="收起侧边栏"
            title="收起侧边栏"
          >
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="m12 5-5 5 5 5" />
            </svg>
          </button>
        </div>
        <div id="sidebar-content" class="sidebar-content">
          <div class="sidebar-heading">
            <span class="sidebar-label">事实库</span
            ><button
              id="create-library"
              title="新建事实库"
              aria-label="新建事实库"
            >
              ＋
            </button>
          </div>
          <nav id="library-list" aria-label="选择事实库"></nav>
          <div class="sidebar-footer">
            <a
              id="ragflow-link"
              target="_blank"
              rel="noopener"
              aria-label="打开 RAGFlow"
              title="打开 RAGFlow"
            >
              <span class="sidebar-label">打开 RAGFlow</span
              ><span class="footer-icon" aria-hidden="true">↗</span>
            </a>
            <button id="logout" aria-label="退出登录" title="退出登录">
              <span class="footer-icon logout-icon" aria-hidden="true">⏻</span
              ><span class="sidebar-label">退出登录</span>
            </button>
          </div>
        </div>
      </aside>
      <main>
        <header class="main-header">
          <div>
            <p class="eyebrow">你的事实工作台</p>
            <h1 id="library-title">选择或创建事实库</h1>
            <p id="library-description" class="muted"></p>
          </div>
          <button id="refresh">刷新</button>
        </header>
        <section id="statistics" class="statistics"></section>
        <nav id="tabs" class="tabs"></nav>
        <div id="notice" class="notice" role="status" hidden></div>
        <section id="content"></section>
      </main>
    </div>
    <dialog id="dialog">
      <div class="dialog-header">
        <h2 id="dialog-title"></h2>
        <button id="dialog-close" aria-label="关闭">×</button>
      </div>
      <div id="dialog-body"></div>
    </dialog>
  </body>
</html>
